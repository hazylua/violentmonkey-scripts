name: Check userscripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax, headers and version bumps
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-userscripts.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check-userscripts.mjs
          fi
